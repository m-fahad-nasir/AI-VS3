name: aivs3
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.2
  - openpyxl>=3.1
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - pillow>=10.0
  - pyyaml>=6.0
  - tqdm>=4.66
  - python-dotenv>=1.0
  - jupyterlab
  - pytest>=8.0
  - pip:
      - openai>=1.55
      - anthropic>=0.42
      - google-genai>=1.0
      - ultralytics>=8.3        # YOLOv11; installs PyTorch (CPU build by default)
      - -e .
